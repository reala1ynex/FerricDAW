[package]
name = "ferric-plugin-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Out-of-process CLAP/VST3 plugin worker for FerricDAW."

[dependencies]
ferric-model = { path = "../ferric-model" }
ferric-dsp = { path = "../ferric-dsp" }
serde.workspace = true
serde_json = "1.0"
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }