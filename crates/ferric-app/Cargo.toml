[package]
name = "ferric-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FerricDAW desktop app."

[[bin]]
name = "ferricdaw"
path = "src/main.rs"

[dependencies]
ferric-model = { path = "../ferric-model" }
ferric-dsp = { path = "../ferric-dsp" }
ferric-engine = { path = "../ferric-engine" }
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
hex.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
