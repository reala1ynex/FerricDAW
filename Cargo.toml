[workspace]
resolver = "2"
members = [
    "crates/ferric-model",
    "crates/ferric-dsp",
    "crates/ferric-engine",
    "crates/ferric-app",
]
default-members = ["crates/ferric-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
rtrb = "0.3"
cpal = "0.15"
midir = "0.10"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav", "flac", "mp3", "ogg", "vorbis", "aiff"] }
midly = "0.5"
libloading = "0.8"
rustfft = "6.2"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package.ferric-dsp]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
