name: FerricDAW CI & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Test & Zero-Warning Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Audio & GUI System Headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace (Deny Warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      - name: Run Automated Unit & Mastering Suite
        run: cargo test --workspace

  package-windows-release:
    name: Package Windows x64 Portable Release
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Assemble Portable Distribution Archive
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          $Ver = $Tag.TrimStart('v')
          $Stage = "dist/FerricDAW"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item target/release/ferricdaw.exe $Stage/
          if (Test-Path target/release/ferric-plugin-bridge.exe) {
            Copy-Item target/release/ferric-plugin-bridge.exe $Stage/
          }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $Stage/
          if (Test-Path tools/SetDs10Capture.ps1) { Copy-Item tools/SetDs10Capture.ps1 $Stage/ }
          if (Test-Path tools/SetLineInCapture.ps1) { Copy-Item tools/SetLineInCapture.ps1 $Stage/ }
          if (Test-Path docs) {
            New-Item -ItemType Directory -Force -Path "$Stage/docs" | Out-Null
            Copy-Item docs/*.md "$Stage/docs/" -ErrorAction SilentlyContinue
          }
          $FeedUrl = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          Set-Content -Path "$Stage/update_feed.url" -Value $FeedUrl -Encoding ascii
          $ZipName = "FerricDAW-$Tag-win-x64.zip"
          $ZipPath = "dist/$ZipName"
          Compress-Archive -Path "$Stage/*" -DestinationPath $ZipPath -Force
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $ZipPath).Hash.ToLowerInvariant()
          $Url = "https://github.com/${{ github.repository }}/releases/download/$Tag/$ZipName"
          @{ version = $Ver; url = $Url; sha256 = $Hash; notes = "FerricDAW $Tag portable Windows x64" } |
            ConvertTo-Json -Compress |
            Set-Content -Path dist/latest.json -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FerricDAW-${{ github.ref_name }}-win-x64.zip
            dist/latest.json
