name: FerricDAW CI & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Test & Zero-Warning Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Audio & GUI System Headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace (Deny Warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      - name: Run Automated Unit & Mastering Suite
        run: cargo test --workspace

  package-windows-release:
    name: Package Windows x64 Portable Release
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Assemble Portable Distribution Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FerricDAW | Out-Null
          Copy-Item target/release/ferricdaw.exe dist/FerricDAW/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/FerricDAW/
          Compress-Archive -Path dist/FerricDAW/* -DestinationPath dist/FerricDAW-${{ github.ref_name }}-win-x64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FerricDAW-${{ github.ref_name }}-win-x64.zip
