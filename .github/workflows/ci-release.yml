name: FerricDAW CI & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Test & Zero-Warning Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    # Mac/Linux legs are advisory for now — do not block the Windows GitHub release.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Audio & GUI System Headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace (Deny Warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets

      - name: Run Automated Unit & Mastering Suite
        run: cargo test --workspace

      - name: Windows Sequential Function Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/FunctionTest-Windows.ps1

  package-windows-release:
    name: Package Windows x64 Portable Release
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Assemble Portable Distribution Archive
        shell: pwsh
        run: |
          $repository = "${{ github.repository }}".Split('/')
          ./tools/Package-WindowsRelease.ps1 -LocalCandidate -GitHubOwner $repository[0] -GitHubRepo $repository[1]
          if (-not (Test-Path -LiteralPath "dist/candidate/FerricDAW-${{ github.ref_name }}-win-x64.zip")) {
            throw 'The release tag must match the Cargo workspace version.'
          }

      - name: Preserve CI Build
        uses: actions/upload-artifact@v4
        with:
          name: FerricDAW-${{ github.ref_name }}-windows-ci
          if-no-files-found: error
          path: |
            dist/candidate/FerricDAW-${{ github.ref_name }}-win-x64.zip
            dist/candidate/latest.json
